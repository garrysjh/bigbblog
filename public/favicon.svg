  <circle cx="256" cy="256" r="226" fill="none" stroke="#0f2b48" stroke-width="26" />
  
  <!-- Pen Nib Base (Bottom Left) -->
  <path d="M 175 320 L 160 365 L 205 350 Z" fill="#0f2b48" stroke="#0f2b48" stroke-width="6" stroke-linejoin="round" />
  
